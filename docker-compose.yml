services:
  web:
    build: .
    restart: unless-stopped
    command: php -S 0.0.0.0:8000 -t public
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-hypermarket}
      DB_USER: ${DB_USER:-hypermarket}
      DB_PASS: ${DB_PASS:-hypermarket}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      CONTACT_ADMIN_EMAIL: ${CONTACT_ADMIN_EMAIL:-admin@example.com}

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hypermarket}
      MYSQL_USER: ${DB_USER:-hypermarket}
      MYSQL_PASSWORD: ${DB_PASS:-hypermarket}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
