name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          response=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "X-Deploy-Secret: ${{ secrets.DEPLOY_SECRET }}" \
            https://acretu.daw.ssmr.ro/deploy-hook.php)
          cat /tmp/response.txt
          if [ "$response" != "200" ]; then
            echo "Deploy hook returned HTTP $response"
            exit 1
          fi
